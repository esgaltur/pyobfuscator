[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skjol"
dynamic = ["version"]
description = "Skjol protects Python code through obfuscation, encryption, and runtime defenses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Dmitrij Sosnovic", email = "dmitriy@sosnovich.com"}
]
keywords = ["obfuscation", "protection", "encryption", "bytecode", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=46.0.7"]
pyd = ["cython>=3.0.0"]
rust = ["cryptography>=46.0.7", "maturin>=1.9,<2"]
all = ["cryptography>=46.0.7", "cython>=3.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.0.0",
    "mypy>=1.20.1",
    "black>=24.0.0",
    "isort>=8.0.1",
    "flake8>=7.0.0",
    "pre-commit>=3.0.0",
    "hypothesis>=6.152.1",
    "bandit>=1.7.0",
]

[project.scripts]
skjol = "pyobfuscator.cli:main"
pyobfuscator = "pyobfuscator.cli:main"

[project.urls]
Homepage = "https://github.com/esgaltur/skjol"
Documentation = "https://github.com/esgaltur/skjol#readme"
Repository = "https://github.com/esgaltur/skjol"
Issues = "https://github.com/esgaltur/skjol/issues"
Changelog = "https://github.com/esgaltur/skjol/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["skjol*", "pyobfuscator*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
pyobfuscator = [
    "README.md",
    "_native/skjol_runtime/Cargo.toml",
    "_native/skjol_runtime/Cargo.lock",
    "_native/skjol_runtime/src/*.rs",
]

[tool.setuptools.dynamic]
version = {attr = "pyobfuscator._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 120

